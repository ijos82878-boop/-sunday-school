<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الأبطال - مدارس الأحد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1a4a;--bg2:#26256a;--card:#fff8e6;--ink:#2a2257;--sun:#ffc933;--coral:#ff6b5a;--mint:#2fd39b;--sky:#5cc8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#3a38a0 0,var(--bg) 55%);color:#fff;font-family:Cairo,Tahoma,sans-serif;font-weight:500}
h1,.big{font-family:Lalezar,Cairo,sans-serif;font-weight:400}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px}
h1{margin:0;font-size:clamp(26px,4vw,44px);color:var(--sun);flex:1;min-width:200px}
.tool{background:#ffffff1f;border-radius:12px;padding:8px 14px;font-weight:700}
.tool:hover{background:#ffffff33}
.go{background:var(--sun);color:var(--ink);font-weight:900}
#segs{display:flex;gap:10px;padding:4px 20px 14px;overflow-x:auto;align-items:center}
.seg{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:40px;background:#ffffff14;font-size:20px;font-weight:700;opacity:.65;transition:.3s}
.seg.done{opacity:.4;text-decoration:line-through}
.seg.on{opacity:1;background:var(--mint);color:#0d3b2c;transform:scale(1.1);box-shadow:0 0 0 4px #2fd39b55;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #2fd39b00}}
.seg .em{font-size:26px}
#board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,390px),1fr));gap:14px;padding:6px 20px 30px}
.kid{background:var(--card);color:var(--ink);border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative;border:4px solid transparent}
.kid.r1{border-color:var(--sun);background:#fff1b8}
.kid.r2{border-color:#c9d3e6}.kid.r3{border-color:#e2a46a}
.rank{font-family:Lalezar,sans-serif;font-size:34px;width:46px;text-align:center;flex:none}
.nm{flex:1;font-size:clamp(20px,2.6vw,28px);font-weight:900;overflow-wrap:anywhere;line-height:1.2}
.pts{font-family:Lalezar,sans-serif;font-size:42px;min-width:56px;text-align:center;color:var(--coral);line-height:1}
.pts small{display:block;font-family:Cairo;font-size:12px;color:#6b6396;font-weight:700}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5) rotate(-6deg)}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.05)}}
.btns{display:flex;flex-direction:column;gap:5px}
.btns div{display:flex;gap:5px}
.b{border-radius:10px;padding:4px 10px;font-weight:900;font-size:17px;background:var(--mint);color:#0d3b2c;min-width:40px}
.b.m{background:#e8e2f7;color:#6b6396}
.b:active{transform:scale(.9)}
.empty{grid-column:1/-1;text-align:center;font-size:24px;padding:40px;opacity:.8}
dialog,.panel{background:var(--bg2);color:#fff;border:0;border-radius:20px;padding:20px;max-width:560px;width:92%}
dialog::backdrop{background:#000a}
textarea,input{width:100%;font:inherit;border-radius:12px;border:2px solid #ffffff44;background:#ffffff14;color:#fff;padding:10px}
.row{display:flex;gap:8px;margin:10px 0;align-items:center;flex-wrap:wrap}
.chip{background:#ffffff1f;border-radius:20px;padding:4px 12px;display:inline-flex;gap:8px;align-items:center;margin:3px}
.chip button{background:none;color:var(--coral);font-weight:900}
h2{font-family:Lalezar;font-weight:400;margin:14px 0 6px;color:var(--sun);font-size:24px}
#win{position:fixed;inset:0;background:#0f0e33f2;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;overflow:auto}
#win.show{display:flex}
#win h1{font-size:clamp(34px,7vw,72px);text-align:center;flex:none}
#pod{display:flex;flex-direction:column;gap:12px;width:min(640px,100%)}
.w{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--ink);border-radius:24px;padding:14px 20px;font-size:clamp(22px,4vw,38px);font-weight:900;transform:scale(0);animation:in .7s cubic-bezier(.2,1.6,.4,1) forwards}
.w:first-child{background:var(--sun);font-size:clamp(28px,5vw,52px)}
.w .big{font-size:1.3em}.w .nm{font-size:1em}.w .pts{font-size:1.2em}
@keyframes in{to{transform:scale(1)}}
.fx{position:fixed;pointer-events:none;z-index:99;font-size:28px}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-150%);background:var(--sun);color:var(--ink);padding:12px 26px;border-radius:40px;font-size:26px;font-weight:900;z-index:80;transition:.5s;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
.bgf{position:fixed;top:100vh;font-size:34px;opacity:.2;pointer-events:none;z-index:0;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-125vh) rotate(360deg)}}
header,#segs,#race,#board{position:relative;z-index:1}
.av{font-size:40px;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(9deg)}}
.kid.r1{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 28px 6px #ffc933aa}}
.kid.pick{animation:none;transform:scale(1.06);box-shadow:0 0 0 6px var(--coral),0 0 30px var(--coral);z-index:4}
#race{margin:0 20px 16px;background:#ffffff14;border-radius:20px;padding:10px 16px}
.trk{position:relative;height:84px;margin:0 34px}
.trk:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px dashed #ffffff44}
.rc{position:absolute;font-size:36px;line-height:1;text-align:center;transform:translateX(50%);transition:right 1.3s cubic-bezier(.3,1.5,.5,1)}
.rc span{display:block;font-size:13px;font-weight:700;white-space:nowrap}
.flag{position:absolute;left:-30px;top:20px;font-size:38px}
#splash{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:#1b1a4acc;pointer-events:none}
#splash .e{font-size:30vmin;line-height:1;animation:zoom 1.7s forwards}
#splash .t{font-family:Lalezar,sans-serif;font-size:12vmin;color:var(--sun)}
@keyframes zoom{0%{transform:scale(0) rotate(-30deg)}30%{transform:scale(1.25) rotate(8deg)}60%,100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.seg.on,.av,.kid.r1,.bgf{animation:none}}
</style>
</head>
<body>
<div id="toast"></div>
<header>
  <h1>🌟 لوحة الأبطال</h1>
  <button class="tool" id="next">⏭️ الفقرة التالية</button>
  <button class="tool" id="pick">🎲 اختار حد</button>
  <button class="tool" id="party">🎉 احتفال</button>
  <button class="tool" id="setup">⚙️ الإعدادات</button>
  <button class="tool" id="mute">🔊</button>
  <button class="tool go" id="finish">🏆 إعلان الفائزين</button>
</header>
<div id="segs"></div>
<div id="race"></div>
<main id="board"></main>
<div id="splash"></div>

<dialog id="dlg">
  <h2 style="margin-top:0">الأسماء الموجودة النهاردة</h2>
  <textarea id="names" rows="4" placeholder="اكتبي الأسماء وبينهم فاصلة أو سطر جديد"></textarea>
  <div class="row"><button class="tool go" id="addn">إضافة الأسماء</button><span id="cnt"></span></div>
  <div id="kidlist"></div>
  <h2>فقرات اليوم</h2>
  <div id="seglist"></div>
  <div class="row"><input id="segname" placeholder="اسم فقرة جديدة (مثلا: لعبة)" style="flex:1"><button class="tool" id="adds">إضافة</button></div>
  <h2>عدد الفائزين في الآخر</h2>
  <div class="row" id="topn"></div>
  <div class="row">
    <button class="tool" id="zero">تصفير كل النقط</button>
    <button class="tool" id="clear">مسح كل الأسماء</button>
    <button class="tool" id="defsegs">الفقرات العادية</button>
    <button class="tool go" id="close" style="margin-inline-start:auto">تمام ✔</button>
  </div>
</dialog>

<section id="win">
  <h1>🏆 أبطال النهاردة 🏆</h1>
  <div id="pod"></div>
  <button class="tool go" id="winclose">رجوع</button>
</section>

<script>
const EM={'صلاة':'🙏','ترانيم':'🎶','تمهيد':'✨','الدرس':'📖','ألعاب':'🎲','لعبة':'🎲'};
const DEF=['صلاة','ترانيم','تمهيد','الدرس','ألعاب'];
let S={segs:[...DEF],cur:0,kids:[],top:3,mute:false};
try{const j=JSON.parse(localStorage.getItem('ssd')||'null');if(j&&j.segs)S=j}catch(e){}
const save=()=>{try{localStorage.setItem('ssd',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const em=t=>EM[t]||'⭐';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- sound ---------- */
let AC;
function tone(f,t0,d,type='sine',v=.18){
  if(S.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  const t=AC.currentTime+t0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const sfx={
  up(n){[660,880,1100].slice(0,n>=5?3:n>=3?2:1).forEach((f,i)=>tone(f,i*.08,.25,'triangle'))},
  down(){tone(300,0,.2,'sawtooth',.08);tone(220,.1,.25,'sawtooth',.08)},
  crown(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.4,'triangle'))},
  tick(){tone(500,0,.1,'square',.07)},
  next(){tone(700,0,.12);tone(950,.1,.2)},
  win(){[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.14,.35,'triangle',.2))}
};

/* ---------- effects ---------- */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function burst(x,y,list,n){
  if(reduce)return;
  for(let i=0;i<n;i++){
    const e=document.createElement('div');e.className='fx';e.textContent=list[i%list.length];
    e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,r=60+Math.random()*120;
    e.animate([{transform:'translate(0,0) scale(.5)',opacity:1},
      {transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-60}px) scale(1.3) rotate(${Math.random()*360}deg)`,opacity:0}],
      {duration:900+Math.random()*500,easing:'ease-out'}).onfinish=()=>e.remove();
  }
}
function rain(){
  if(reduce)return;
  const L=['🎉','⭐','🌟','🎊','✨','🏆','💛'];
  for(let i=0;i<70;i++){
    const e=document.createElement('div');e.className='fx';e.textContent=L[i%L.length];
    e.style.left=Math.random()*100+'vw';e.style.top='-40px';e.style.zIndex=120;document.body.appendChild(e);
    e.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(${innerHeight+80}px) rotate(${Math.random()*720}deg)`}],
      {duration:2500+Math.random()*2500,delay:Math.random()*1500,easing:'ease-in'}).onfinish=()=>e.remove();
  }
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- logic ---------- */
const sorted=()=>[...S.kids].sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n,'ar'));
function addPts(id,d,btn){
  const k=S.kids.find(x=>x.id===id);if(!k)return;
  const before=sorted()[0];
  const first=sorted().map(x=>x.id);
  k.p=Math.max(0,k.p+d);save();
  if(btn){const r=btn.getBoundingClientRect();
    if(d>0)burst(r.left+r.width/2,r.top,['⭐','🌟','✨','💛'],6+d*2);}
  d>0?sfx.up(d):sfx.down();
  render(id);
  const top=sorted()[0];
  if(d>0&&top.id===id&&before&&before.id!==id&&S.kids.length>1){
    sfx.crown();toast('👑 '+k.n+' بقى الأول!');burst(innerWidth/2,innerHeight/3,['👑','🎉','⭐'],18);
  }
}

/* ---------- render ---------- */
function renderSegs(){
  $('segs').innerHTML='';
  S.segs.forEach((t,i)=>{
    const d=document.createElement('div');d.className='seg'+(i===S.cur?' on':i<S.cur?' done':'');
    d.innerHTML='<span class="em"></span><span></span>';
    d.children[0].textContent=em(t);d.children[1].textContent=t;
    $('segs').appendChild(d);
  });
  const on=$('segs').querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function render(hot){
  const old={};document.querySelectorAll('.kid').forEach(e=>old[e.dataset.id]=e.getBoundingClientRect());
  S.kids.forEach(k=>{if(!k.a)k.a=AV[Math.floor(Math.random()*AV.length)]});
  const b=$('board');b.innerHTML='';
  const list=sorted();
  if(!list.length){b.innerHTML='<div class="empty">اضغطي ⚙️ الإعدادات وضيفي أسماء الأطفال الموجودين 🙌</div>';}
  let rank=0,prev=null;
  list.forEach((k,i)=>{
    if(k.p!==prev){rank=i+1;prev=k.p}
    const c=document.createElement('div');c.className='kid'+(rank<=3&&k.p>0?' r'+rank:'');c.dataset.id=k.id;
    const medal=k.p>0?(rank===1?'👑':rank===2?'🥈':rank===3?'🥉':rank):rank;
    c.innerHTML='<div class="rank"></div><div class="av"></div><div class="nm"></div><div class="pts"><span class="v"></span><small>نقطة</small></div><div class="btns"><div></div><div></div></div>';
    c.querySelector('.rank').textContent=medal;
    c.querySelector('.nm').textContent=k.n;c.querySelector('.av').textContent=k.a;
    const v=c.querySelector('.v');v.textContent=k.p;
    if(k.id===hot){v.classList.add('bump');}
    const [r1,r2]=c.querySelectorAll('.btns div');
    [[1,'+1'],[3,'+3'],[5,'+5']].forEach(([d,l])=>{const x=document.createElement('button');x.className='b';x.textContent=l;x.onclick=()=>addPts(k.id,d,x);r1.appendChild(x)});
    const m=document.createElement('button');m.className='b m';m.textContent='−1';m.onclick=()=>addPts(k.id,-1,m);r2.appendChild(m);
    b.appendChild(c);
    const o=old[k.id];
    if(o&&!reduce){const n=c.getBoundingClientRect();const dx=o.left-n.left,dy=o.top-n.top;
      if(dx||dy)c.animate([{transform:`translate(${dx}px,${dy}px)`,zIndex:5},{transform:'none'}],{duration:650,easing:'cubic-bezier(.2,1.2,.4,1)'});}
    if(k.id===hot)c.classList.add('pop');
  });
  renderSegs();renderRace();
}
function renderSetup(){
  $('kidlist').innerHTML='';
  S.kids.forEach(k=>{const c=document.createElement('span');c.className='chip';c.append(k.n+' ');
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','حذف '+k.n);
    x.onclick=()=>{S.kids=S.kids.filter(z=>z.id!==k.id);save();renderSetup();render()};c.appendChild(x);$('kidlist').appendChild(c)});
  $('cnt').textContent=S.kids.length?'عدد الأطفال: '+S.kids.length:'';
  $('seglist').innerHTML='';
  S.segs.forEach((t,i)=>{const c=document.createElement('span');c.className='chip';c.append(em(t)+' '+t+' ');
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','حذف '+t);
    x.onclick=()=>{S.segs.splice(i,1);if(S.cur>=S.segs.length)S.cur=Math.max(0,S.segs.length-1);save();renderSetup();renderSegs()};c.appendChild(x);$('seglist').appendChild(c)});
  $('topn').innerHTML='';
  [2,3,5].forEach(n=>{const b=document.createElement('button');b.className='tool'+(S.top===n?' go':'');b.textContent='أحسن '+n;
    b.onclick=()=>{S.top=n;save();renderSetup()};$('topn').appendChild(b)});
}

/* ---------- events ---------- */
$('setup').onclick=()=>{renderSetup();$('dlg').showModal()};
$('close').onclick=()=>$('dlg').close();
$('addn').onclick=()=>{
  $('names').value.split(/[,،\n]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
    if(!S.kids.some(k=>k.n===n))S.kids.push({id:uid(),n,p:0})});
  $('names').value='';save();renderSetup();render();sfx.next();
};
$('adds').onclick=()=>{const v=$('segname').value.trim();if(!v)return;S.segs.push(v);$('segname').value='';save();renderSetup();renderSegs()};
$('segname').onkeydown=e=>{if(e.key==='Enter')$('adds').click()};
$('defsegs').onclick=()=>{S.segs=[...DEF];S.cur=0;save();renderSetup();renderSegs()};
$('zero').onclick=()=>{if(confirm('تصفير نقط كل الأطفال؟')){S.kids.forEach(k=>k.p=0);save();render()}};
$('clear').onclick=()=>{if(confirm('مسح كل الأسماء؟')){S.kids=[];save();renderSetup();render()}};
$('next').onclick=()=>{
  if(!S.segs.length)return;
  S.cur=(S.cur+1)%S.segs.length;save();renderSegs();sfx.next();
  splash(em(S.segs[S.cur]),S.segs[S.cur]);
};
$('mute').onclick=()=>{S.mute=!S.mute;$('mute').textContent=S.mute?'🔇':'🔊';save()};
$('mute').textContent=S.mute?'🔇':'🔊';
$('finish').onclick=()=>{
  const list=sorted().filter(k=>k.p>0).slice(0,S.top);
  if(!list.length){toast('لسه مفيش نقط! ضيفي نقط الأول 😊');return}
  const pod=$('pod');pod.innerHTML='';$('win').classList.add('show');
  const order=list.map((k,i)=>({k,i})).reverse();
  order.forEach(({k,i},step)=>setTimeout(()=>{
    const w=document.createElement('div');w.className='w';
    w.innerHTML='<span class="big"></span><span class="nm"></span><span class="pts"></span>';
    w.children[0].textContent=i===0?'👑':i===1?'🥈':i===2?'🥉':'⭐';
    w.children[1].textContent=k.n;w.children[2].textContent=k.p;
    pod.prepend(w);
    if(i===0){sfx.win();rain();burst(innerWidth/2,innerHeight/2,['🎉','⭐','🌟','🎊'],30)}else sfx.crown();
  },900+step*1600));
};
$('winclose').onclick=()=>$('win').classList.remove('show');
const AV=['🦁','🐯','🐼','🦊','🐸','🐵','🦄','🐙','🐧','🦉','🐬','🦖','🐰','🐻','🦋','🐢'];
function renderRace(){
  const r=$('race'),l=sorted().slice(0,8);
  if(!l.length){r.style.display='none';return}
  r.style.display='';
  if(!r.firstChild){r.innerHTML='<div class="trk"><span class="flag">🏁</span></div>'}
  const t=r.firstChild,mx=Math.max(1,...l.map(k=>k.p));
  const keep=new Set(l.map(k=>'rc'+k.id));
  [...t.querySelectorAll('.rc')].forEach(e=>{if(!keep.has(e.id))e.remove()});
  l.forEach((k,i)=>{
    let e=document.getElementById('rc'+k.id);
    if(!e){e=document.createElement('div');e.className='rc';e.id='rc'+k.id;e.style.right='0%';e.innerHTML='<div></div><span></span>';t.appendChild(e);e.getBoundingClientRect()}
    e.firstChild.textContent=k.a;e.lastChild.textContent=k.n;
    e.style.top=(i%2?44:0)+'px';
    e.style.right=(k.p/mx*90)+'%';
    e.style.zIndex=20-i;
  });
}
function splash(e,t){
  const s=$('splash');s.innerHTML='<div class="e"></div><div class="t"></div>';
  s.firstChild.textContent=e;s.lastChild.textContent=t;s.style.display='flex';
  sfx.crown();burst(innerWidth/2,innerHeight/2,['⭐','🎈','✨','🎉'],20);
  setTimeout(()=>s.style.display='none',1900);
}
function pickKid(){
  const ks=[...document.querySelectorAll('.kid')];if(ks.length<2)return;
  let i=Math.floor(Math.random()*ks.length),n=0,d=70;const total=20+Math.floor(Math.random()*ks.length);
  const step=()=>{
    ks.forEach(k=>k.classList.remove('pick'));
    const k=ks[i%ks.length];k.classList.add('pick');k.scrollIntoView({block:'nearest'});sfx.tick();i++;n++;
    if(n<total){d*=1.09;setTimeout(step,d)}
    else{sfx.crown();const q=k.getBoundingClientRect();burst(q.left+q.width/2,q.top,['🎯','⭐','🎉'],14);
      toast('🎯 دورك يا '+k.querySelector('.nm').textContent+'!');setTimeout(()=>k.classList.remove('pick'),4000)}
  };
  step();
}
$('pick').onclick=pickKid;
$('party').onclick=()=>{sfx.win();rain();burst(innerWidth/2,innerHeight/2,['🎉','⭐','🌟','🎊'],24)};
const FL=['⭐','🎈','🌈','🕊️','🎵','💛','🌟','🎶'];
if(!reduce)for(let i=0;i<14;i++){const e=document.createElement('div');e.className='bgf';e.textContent=FL[i%FL.length];e.style.left=Math.random()*96+'vw';e.style.animationDuration=(14+Math.random()*16)+'s';e.style.animationDelay=(-Math.random()*20)+'s';document.body.appendChild(e)}
render();
</script>
